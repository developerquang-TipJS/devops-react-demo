server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không khớp file thật đều trả về index.html để React xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File trong assets/ có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
