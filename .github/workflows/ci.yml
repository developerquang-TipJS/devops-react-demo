name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: kiểm tra chất lượng code
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Job 2: build Docker image và push lên GitHub Container Registry (ghcr.io)
  docker:
    needs: build                                  # chỉ chạy khi job build thành công
    if: github.event_name == 'push'               # PR thì không push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                             # cần quyền này để push lên ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token GitHub tự cấp, không cần tạo secret

      # Tạo tag: latest + mã commit (sha) để biết image nào ứng với commit nào
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
